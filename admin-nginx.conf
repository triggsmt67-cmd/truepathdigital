# Nginx SEO Configuration for admin.truepath406.com
server {
    server_name admin.truepath406.com;
    
    # ... your existing SSL/TLS and root directives ...

    # B) Block indexing: Set X-Robots-Tag for all requests
    add_header X-Robots-Tag "noindex, nofollow" always;

    # A) Ensure WP paths are processed normally without redirect
    location ~* ^/(wp-admin|wp-login\.php|graphql|wp-json|xmlrpc\.php|wp-content|wp-includes|robots\.txt|sitemap.*\.xml) {
        try_files $uri $uri/ /index.php?$args;
    }

    # A) Redirect all other requests (public posts) to Next.js / React frontend
    location / {
        rewrite ^/?(.*)$ https://truepath406.com/blog/$1 permanent;
    }
}
